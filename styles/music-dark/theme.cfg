# music-dark — flat near-black chrome for a dedicated music session
# Based on the contrast of bora_black, without grey wallpaper.

background: none
background.color: #0b0b0d

menu.frame.font: sans-10
menu.title.font: sans-10:bold
toolbar.clock.font: sans-9:bold
toolbar.workspace.font: sans-9:bold
toolbar.iconbar.focused.font: sans-8:bold
toolbar.iconbar.unfocused.font: sans-8
window.font: sans-9

menu.bevelWidth: 1
menu.borderColor: #2a2a2a
menu.borderWidth: 1
menu.bullet: triangle
menu.bullet.position: Right

menu.title: flat
menu.title.justify: center
menu.title.color: #111111
menu.title.colorTo: #111111
menu.title.textColor: #e6e6e6

menu.frame: flat
menu.frame.justify: left
menu.frame.color: #141414
menu.frame.colorTo: #141414
menu.frame.textColor: #f0f0f0
menu.frame.disableColor: #666666

menu.hilite: flat
menu.hilite.color: #2c2c2c
menu.hilite.colorTo: #2c2c2c
menu.hilite.textColor: #ffffff

toolbar.bevelWidth: 0
toolbar.borderWidth: 1
toolbar.borderColor: #2a2a2a
toolbar.height: 20
toolbar.justify: center
toolbar: flat
toolbar.color: #111111
toolbar.colorTo: #111111

toolbar.clock: parentrelative
toolbar.clock.textColor: #e6e6e6
toolbar.workspace: parentrelative
toolbar.workspace.textColor: #e6e6e6
toolbar.button: parentrelative
toolbar.button.picColor: #e6e6e6
toolbar.button.pressed: parentrelative
toolbar.button.pressed.picColor: #888888

toolbar.iconbar.borderWidth: 1
toolbar.iconbar.borderColor: #2a2a2a
toolbar.iconbar.empty: parentrelative
toolbar.iconbar.focused: flat
toolbar.iconbar.focused.color: #1c1c1c
toolbar.iconbar.focused.textColor: #f0f0f0
toolbar.iconbar.unfocused: flat
toolbar.iconbar.unfocused.color: #111111
toolbar.iconbar.unfocused.textColor: #777777

window.roundCorners: TopRight TopLeft
window.bevelWidth: 1
window.borderWidth: 1
window.borderColor: #2a2a2a
window.justify: Center
window.title.height: 18

window.title.focus: flat
window.title.focus.color: #161616
window.title.focus.colorTo: #161616
window.title.unfocus: flat
window.title.unfocus.color: #101010
window.title.unfocus.colorTo: #101010

window.label.focus: parentrelative
window.label.focus.textColor: #f0f0f0
window.label.unfocus: parentrelative
window.label.unfocus.textColor: #777777

window.button.focus: parentrelative
window.button.focus.picColor: #e6e6e6
window.button.unfocus: parentrelative
window.button.unfocus.picColor: #666666
window.button.pressed: parentrelative
window.button.pressed.picColor: #888888

window.handle.focus: flat
window.handle.focus.color: #161616
window.handle.unfocus: flat
window.handle.unfocus.color: #101010
window.handleWidth: 2

window.grip.focus: flat
window.grip.focus.color: #2a2a2a
window.grip.unfocus: flat
window.grip.unfocus.color: #101010
